plugins {
    id 'java'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = boot_version
group = 'net.riftwatch'

base {
    archivesName = 'rift_boot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url = 'https://libraries.minecraft.net'
    }
}

dependencies {
    compileOnly("net.neoforged.fancymodloader:earlydisplay:${fml_version}") {
        transitive = false
    }
    compileOnly("net.neoforged.fancymodloader:loader:${fml_version}") {
        transitive = false
    }
    compileOnly("org.lwjgl:lwjgl:${lwjgl_version}")
    compileOnly("org.lwjgl:lwjgl-glfw:${lwjgl_version}")
    compileOnly("org.lwjgl:lwjgl-opengl:${lwjgl_version}")
    compileOnly("org.lwjgl:lwjgl-stb:${lwjgl_version}")
    compileOnly("org.slf4j:slf4j-api:${slf4j_version}")
    compileOnly("cpw.mods:modlauncher:${modlauncher_version}") {
        transitive = false
    }
    compileOnly("net.sf.jopt-simple:jopt-simple:${jopt_version}")
    compileOnly("cpw.mods:securejarhandler:${securejarhandler_version}") {
        transitive = false
    }
    compileOnly("org.jetbrains:annotations:${annotations_version}")
    compileOnly("com.google.code.gson:gson:${gson_version}")

    testImplementation("com.google.code.gson:gson:${gson_version}")
    testImplementation("org.slf4j:slf4j-api:${slf4j_version}")
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def bootVersion = project.version.toString()

tasks.named('processResources', ProcessResources) {
    inputs.property('version', bootVersion)
    filesMatching('net/riftwatch/boot/update/boot.properties') {
        expand('version': bootVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Automatic-Module-Name': 'riftwatch.boot',
            'Implementation-Title': 'Riftwatch Boot',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Riftwatch'
        )
    }
}
